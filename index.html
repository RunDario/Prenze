<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atletica AMA Civitanova by D. Padovan</title>
  <style>
    :root {
      --bg-pastel: #f7f4ff;
      --card-bg: #ffffff;
      --ink: #252238;
      --muted: #6c6785;
      --lavender: #e6ddff;
      --lavender-border: #cbbcf7;
      --mint: #d8f5e6;
      --mint-accent: #2ea86f;
      --peach: #ffe8d6;
      --sky: #dff1ff;
      --rose: #ffe0ec;
      --shadow: 0 10px 28px rgba(72, 58, 128, 0.08);
    }

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(160deg, var(--bg-pastel) 0%, #eef7ff 55%, #fff5f8 100%);
      color: var(--ink);
      padding: 20px 14px 60px;
      overflow-x: hidden;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 22px 20px 26px;
      box-shadow: var(--shadow);
      border: 1px solid #ece7fb;
      position: relative;
      z-index: 2;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.45rem;
      text-align: center;
      color: #362d66;
    }

    .subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 20px;
      font-weight: 600;
    }

    .field {
      margin-bottom: 16px;
    }

    label.field-label {
      display: block;
      font-weight: 700;
      font-size: 0.92rem;
      margin-bottom: 6px;
      color: #3a345c;
    }

    input[type="date"],
    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 11px 13px;
      border-radius: 14px;
      border: 1.5px solid #ddd6f5;
      background: #fcfbff;
      color: var(--ink);
      font-size: 0.98rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #8f74e8;
      box-shadow: 0 0 0 3px rgba(143, 116, 232, 0.16);
    }

    textarea {
      min-height: 82px;
      resize: vertical;
    }

    .col-spacer {
      height: 12px;
      border-radius: 10px;
      background: repeating-linear-gradient(
        90deg,
        rgba(203, 188, 247, 0.22) 0,
        rgba(203, 188, 247, 0.22) 8px,
        transparent 8px,
        transparent 16px
      );
      margin: 14px 0;
    }

    details.box {
      background: #faf8ff;
      border: 1.5px solid var(--lavender-border);
      border-radius: 16px;
      padding: 10px 14px;
      margin-bottom: 16px;
    }

    details.box > summary {
      list-style: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.95rem;
      color: #362d66;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    details.box > summary::-webkit-details-marker {
      display: none;
    }

    .summary-badge {
      background: var(--lavender);
      color: #362d66;
      font-size: 0.8rem;
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 700;
    }

    .athletes-toolbar {
      display: flex;
      gap: 8px;
      margin: 12px 0 10px;
      flex-wrap: wrap;
    }

    .btn-mini {
      border: none;
      border-radius: 12px;
      padding: 8px 12px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      background: var(--sky);
      color: #1f4b6e;
      transition: transform 0.12s, filter 0.15s;
    }

    .btn-mini:hover {
      filter: brightness(0.97);
    }

    .btn-mini:active {
      transform: scale(0.97);
    }

    .athletes-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .athlete-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 12px;
      background: #ffffff;
      border: 1.5px solid #e6e0f8;
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 600;
      user-select: none;
    }

    .athlete-chip input {
      accent-color: #7958e0;
      width: 17px;
      height: 17px;
      cursor: pointer;
    }

    .add-row {
      display: flex;
      gap: 8px;
    }

    .add-row input {
      flex: 1;
    }

    .btn-submit {
      width: 100%;
      padding: 14px 18px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #63d49c 0%, #37b379 100%);
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(55, 179, 121, 0.28);
      transition: transform 0.15s, opacity 0.2s;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .status {
      margin-top: 14px;
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 0.92rem;
      font-weight: 600;
      display: none;
      text-align: center;
    }

    .status.ok {
      display: block;
      background: var(--mint);
      color: #165c3b;
    }

    .status.err {
      display: block;
      background: var(--rose);
      color: #7c1d3f;
    }

    /* Atleta animata che attraversa lo schermo */
    .runner-stage {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 18px;
      height: 92px;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }

    .runner-actor {
      position: absolute;
      left: -180px;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
    }

    .runner-actor.run {
      animation: crossScreen 2.6s linear forwards;
    }

    @keyframes crossScreen {
      0% {
        left: -190px;
        opacity: 1;
        transform: translateY(0px);
      }
      25% {
        transform: translateY(-6px);
      }
      50% {
        transform: translateY(0px);
      }
      75% {
        transform: translateY(-6px);
      }
      90% {
        opacity: 1;
      }
      100% {
        left: calc(100vw + 60px);
        opacity: 0;
        transform: translateY(0px);
      }
    }

    .runner-emoji {
      font-size: 3rem;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.14));
    }

    .speech-bubble {
      background: #fff8d6;
      border: 2px solid #f2c94c;
      color: #3d3100;
      padding: 6px 12px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 0.85rem;
      white-space: nowrap;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
    }

    /* Esplosione emoji soldi */
    .money-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 30;
      overflow: hidden;
    }

    .money-drop {
      position: absolute;
      top: -50px;
      font-size: 2rem;
      animation: fallMoney linear forwards;
    }

    @keyframes fallMoney {
      0% {
        transform: translateY(-40px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(108vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Atletica AMA Civitanova</h1>
    <div class="subtitle">by D. Padovan</div>

    <form id="trainingForm">
      <!-- 1. Data -->
      <div class="field">
        <label class="field-label" for="data">📅 Data allenamento</label>
        <input type="date" id="data" name="data" required />
      </div>

      <!-- 2. Disciplina -->
      <div class="field">
        <label class="field-label" for="disciplina">🏃‍♀️ Disciplina</label>
        <select id="disciplina" name="disciplina" required>
          <option value="Marcia">Marcia</option>
          <option value="Corsa">Corsa</option>
          <option value="Palestra">Palestra</option>
          <option value="Velocità">Velocità</option>
          <option value="Gradoni">Gradoni</option>
        </select>
      </div>

      <!-- 3. Attività -->
      <div class="field">
        <label class="field-label" for="attivita">📝 Attività svolta</label>
        <input
          type="text"
          id="attivita"
          name="attivita"
          placeholder="Es. Ripetute 8x400, Tecnica, Fondo..."
          required
        />
      </div>

      <!-- 4. Colonna vuota di allineamento (7 colonne sul foglio) -->
      <div class="col-spacer" aria-hidden="true"></div>

      <!-- 5. Atleti presenti -->
      <details class="box" open>
        <summary>
          <span>👥 Atleti presenti</span>
          <span class="summary-badge" id="selectedCount">0 selezionati</span>
        </summary>

        <div class="athletes-toolbar">
          <button type="button" class="btn-mini" id="btnAll">✅ Tutti</button>
          <button type="button" class="btn-mini" id="btnNone">⬜ Nessuno</button>
        </div>

        <div class="athletes-grid" id="athletesGrid"></div>

        <div class="add-row">
          <input
            type="text"
            id="newAthleteInput"
            placeholder="Aggiungi nuovo atleta..."
          />
          <button type="button" class="btn-mini" id="btnAddAthlete">+ Aggiungi</button>
        </div>
      </details>

      <!-- 6. Note -->
      <div class="field">
        <label class="field-label" for="note">🗒️ Note</label>
        <textarea
          id="note"
          name="note"
          placeholder="Es. Ritmi, recuperi, pioggia, sensazioni..."
        ></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        💸 INVIA E INCASSA!
      </button>

      <div id="statusBox" class="status"></div>
    </form>
  </div>

  <div class="runner-stage">
    <div id="runnerActor" class="runner-actor">
      <span class="runner-emoji">🏃‍♀️</span>
      <span id="speechBubble" class="speech-bubble">Daje!</span>
    </div>
  </div>

  <div id="moneyLayer" class="money-layer"></div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxl6U1a_s15h348z665F7vC84fJ56oL4N9e-p880dJSuM6p_27b9dG2J6n3f8d5080Q/exec";

    const DEFAULT_ATHLETES = [
      "Alessandra",
      "Maria",
      "Linda",
      "Giada",
      "Terry",
      "Giorgia",
      "Viola"
    ];

    const DISCIPLINE_FRASI = {
      "Marcia": "Tacco-punta e bacino vivo!",
      "Corsa": "Ritmo sciolto, andiamo!",
      "Palestra": "Forza e core compatto!",
      "Velocità": "Reattive sui blocchi!",
      "Gradoni": "Spinta sui gradoni, daje!"
    };

    const form = document.getElementById("trainingForm");
    const dataInput = document.getElementById("data");
    const disciplinaSelect = document.getElementById("disciplina");
    const attivitaInput = document.getElementById("attivita");
    const noteInput = document.getElementById("note");
    const athletesGrid = document.getElementById("athletesGrid");
    const selectedCount = document.getElementById("selectedCount");
    const btnAll = document.getElementById("btnAll");
    const btnNone = document.getElementById("btnNone");
    const newAthleteInput = document.getElementById("newAthleteInput");
    const btnAddAthlete = document.getElementById("btnAddAthlete");
    const submitBtn = document.getElementById("submitBtn");
    const statusBox = document.getElementById("statusBox");
    const runnerActor = document.getElementById("runnerActor");
    const speechBubble = document.getElementById("speechBubble");
    const moneyLayer = document.getElementById("moneyLayer");

    // Imposta data odierna di default
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, "0");
    const dd = String(today.getDate()).padStart(2, "0");
    dataInput.value = `${yyyy}-${mm}-${dd}`;

    // Audio sintetizzato con Web Audio API
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playPop(freq = 520) {
      const ctx = getAudioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.45, ctx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.14, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.09);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.09);
    }

    function playChaChing() {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;

      // Primo tintinnio ("cha")
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.type = "triangle";
      osc1.frequency.setValueAtTime(987.77, now); // B5
      gain1.gain.setValueAtTime(0.18, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.start(now);
      osc1.stop(now + 0.12);

      // Secondo tintinnio brillante ("ching!")
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = "sine";
      osc2.frequency.setValueAtTime(1318.51, now + 0.1); // E6
      osc2.frequency.setValueAtTime(1567.98, now + 0.16); // G6
      gain2.gain.setValueAtTime(0.22, now + 0.1);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.start(now + 0.1);
      osc2.stop(now + 0.55);
    }

    function triggerRunner(discipline) {
      speechBubble.textContent = DISCIPLINE_FRASI[discipline] || "Daje!";
      runnerActor.classList.remove("run");
      void runnerActor.offsetWidth;
      runnerActor.classList.add("run");
      playPop(460);
    }

    function triggerMoneyExplosion() {
      const emojis = ["💵", "💶", "💰", "🤑", "💸"];
      for (let i = 0; i < 36; i++) {
        const drop = document.createElement("div");
        drop.className = "money-drop";
        drop.textContent = emojis[i % emojis.length];
        drop.style.left = `${Math.random() * 96}vw`;
        drop.style.animationDuration = `${1.4 + Math.random() * 1.4}s`;
        drop.style.animationDelay = `${Math.random() * 0.35}s`;
        moneyLayer.appendChild(drop);
        setTimeout(() => drop.remove(), 3200);
      }
    }

    function updateCount() {
      const checked = athletesGrid.querySelectorAll('input[type="checkbox"]:checked').length;
      selectedCount.textContent = `${checked} selezionat${checked === 1 ? "o" : "i"}`;
    }

    function renderAthlete(name, checked = false) {
      const label = document.createElement("label");
      label.className = "athlete-chip";

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.value = name;
      cb.checked = checked;
      cb.addEventListener("change", () => {
        playPop(checked ? 620 : 500);
        updateCount();
      });

      const span = document.createElement("span");
      span.textContent = name;

      label.appendChild(cb);
      label.appendChild(span);
      athletesGrid.appendChild(label);
      updateCount();
    }

    DEFAULT_ATHLETES.forEach((name) => renderAthlete(name, false));

    disciplinaSelect.addEventListener("change", (e) => {
      triggerRunner(e.target.value);
    });

    btnAll.addEventListener("click", () => {
      athletesGrid.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
        cb.checked = true;
      });
      playPop(680);
      updateCount();
    });

    btnNone.addEventListener("click", () => {
      athletesGrid.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
        cb.checked = false;
      });
      playPop(380);
      updateCount();
    });

    btnAddAthlete.addEventListener("click", () => {
      const name = newAthleteInput.value.trim();
      if (!name) return;
      renderAthlete(name, true);
      newAthleteInput.value = "";
      playPop(740);
    });

    newAthleteInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        btnAddAthlete.click();
      }
    });

    function formatDateIT(isoDate) {
      if (!isoDate || !isoDate.includes("-")) return isoDate;
      const [y, m, d] = isoDate.split("-");
      return `${d}/${m}/${y}`;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusBox.className = "status";
      statusBox.style.display = "none";

      const selectedAthletes = Array.from(
        athletesGrid.querySelectorAll('input[type="checkbox"]:checked')
      )
        .map((cb) => cb.value)
        .join(" ");

      const payload = {
        data: formatDateIT(dataInput.value),
        disciplina: disciplinaSelect.value,
        attivita: attivitaInput.value.trim(),
        atletiPresenti: selectedAthletes,
        note: noteInput.value.trim()
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });

        playChaChing();
        triggerMoneyExplosion();
        triggerRunner(payload.disciplina);

        statusBox.textContent = "✅ Allenamento inviato al foglio 'Allenamenti'!";
        statusBox.className = "status ok";
        statusBox.style.display = "block";

        attivitaInput.value = "";
        noteInput.value = "";
      } catch (err) {
        statusBox.textContent = "❌ Errore durante l'invio: " + err.message;
        statusBox.className = "status err";
        statusBox.style.display = "block";
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
